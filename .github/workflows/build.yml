name: Build and Test Loveli

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest # Важно! Используем Windows из-за msnodesqlv8

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

  build-and-push:
    needs: test # Запустится только если тесты прошли
    runs-on: ubuntu-latest # Сборка Docker может идти на Linux
    permissions:
      contents: read
      packages: write # Нужно для публикации образа в GHCR

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/loveli-backend:latest
          ghcr.io/${{ github.repository }}/loveli-backend:${{ github.sha }}